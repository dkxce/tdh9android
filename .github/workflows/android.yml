name: Android CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - 'README.en.md'
      - '.github/workflows/**'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - 'README.en.md'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # Resolve the Gradle version from gradle/wrapper/gradle-wrapper.properties
    # (8.9) and invoke it directly, so we do not depend on the gradlew scripts
    # or a committed gradle-wrapper.jar being present.
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.9'

    - name: Build with Gradle
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk