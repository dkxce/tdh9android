name: Auto Translate README to English

on:
  push:
    branches:
      - main
    paths:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Translate README to English
        uses: infocus7/translate-markdown-action@v1
        with:
          sources: README.md
          from: ru
          to: en

      - name: Commit & Push changes
        run: |
          git config --local user.email "41898282+github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "docs: auto-translate README to English"
          git push
