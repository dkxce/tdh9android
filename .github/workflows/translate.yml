name: Auto Translate README to English

on:
  push:
    branches:
      - main
    paths:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Устанавливаем бесплатную и надежную библиотеку перевода
      - name: Install Python translation library
        run: pip install deep-translator

      # 2. Запускаем простой скрипт, который считывает README.md, переводит его и сохраняет в README.en.md
      - name: Translate README via Python
        run: |
          python -c "
          import os
          from deep_translator import GoogleTranslator

          # Считываем исходный файл
          with open('README.md', 'r', encoding='utf-8') as f:
              text = f.read()

          # GoogleTranslator бесплатно переводит тексты до 5000 символов за один запрос.
          # Чтобы не упасть на больших файлах, переводим текст по абзацам.
          paragraphs = text.split('\n\n')
          translated_paragraphs = []
          
          translator = GoogleTranslator(source='ru', target='en')
          
          for p in paragraphs:
              if p.strip():
                  try:
                      # Переводим абзац
                      translated_paragraphs.append(translator.translate(p))
                  except Exception as e:
                      # Если строка служебная или произошел сбой — оставляем как есть
                      translated_paragraphs.append(p)
              else:
                  translated_paragraphs.append('')

          # Сохраняем результат в английскую версию
          with open('README.en.md', 'w', encoding='utf-8') as f:
              f.write('\n\n'.join(translated_paragraphs))
          "

      # 3. Сохраняем результат в репозиторий
      - name: Commit & Push changes
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.en.md
          git diff --quiet && git diff --staged --quiet || git commit -m "docs: auto-translate README to English"
          git push
