name: Auto Translate README to English

on:
  push:
    branches:
      - main
    paths:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Auto Translate Markdown
        uses: ikhsan3adi/markdown-translator@v3
        with:
          LANG: en
          FILES: |
            README.md
          INCREMENTAL: true

      - name: Commit & Push changes
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          # Коммитим только если появились изменения, иначе билд завершится с ошибкой
          git diff --quiet && git diff --staged --quiet || git commit -m "docs: auto-translate README to English"
          git push
